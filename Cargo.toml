[package]
name = "foobar-language-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "foobar"
path = "src/main.rs"

[dependencies]
tower-lsp-server = "0.23"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-std",
  "io-util",
  "time",
] }
tree-sitter = "0.26"
tree-sitter-foobar = { path = "../tree-sitter-foobar" }
# Default `unicode_lines` also breaks lines at U+2028 etc., which LSP does not.
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
dashmap = "6"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
ariadne = "0.6"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-util",
  "sync",
  "test-util",
] }
